<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ECME 홈페이지 후보 3안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: intro + how-to, three candidate cards, a compact comparison, a feedback form that copies a summary, then a link to all drafts. */
  :root { --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --mute: #64748b; --line: rgba(15,23,42,.1); --acc: #4338ca; --tint: #e0e7ff; --ok: #15803d;
          --f: Inter, "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1420; --card: #171d2b; --ink: #e6e9f0; --mute: #9aa3b5; --line: rgba(230,233,240,.12); --acc: #a5b4fc; --tint: #262d4d; --ok: #4ade80; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f); word-break: keep-all; }
  .wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header.top { padding-block: 44px 8px; }
  .toprow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  h2 { font-size: 21px; margin: 0 0 6px; text-wrap: balance; }
  .lead { color: var(--mute); max-width: 70ch; margin: 12px 0 0; }
  .steps { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; padding: 0; margin: 18px 0 0; }
  .steps li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .steps b { color: var(--acc); margin-right: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 50px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); color: var(--ink); padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--tint); color: var(--acc); font-weight: 600; }
  section { padding-block: 28px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 5px 20px rgba(0,0,0,.06); transition: transform .25s, box-shadow .25s; min-width: 0; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,.1); }
  .thumb { display: block; aspect-ratio: 16 / 10; background: var(--tint); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .num { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--acc); }
  .body h3 { font-size: 19px; margin: 0; }
  .body p { margin: 0; color: var(--mute); font-size: 14px; }
  .body ul { margin: 2px 0 0; padding-left: 18px; color: var(--mute); font-size: 13.5px; }
  .open { margin-top: auto; align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; padding: 9px 18px; border-radius: 50px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
  .url { font-size: 12px; color: var(--mute); overflow-wrap: anywhere; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 15px; padding: 22px; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--mute); font-weight: 600; font-size: 12.5px; }
  td:first-child { color: var(--mute); white-space: nowrap; }
  .q { display: grid; gap: 8px; margin-top: 18px; }
  .q > label, .q > .qt { font-weight: 600; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .opt { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .opt:has(input:checked) { border-color: var(--acc); background: var(--tint); }
  .opt input { accent-color: var(--acc); }
  textarea, input[type="text"] { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  textarea { resize: vertical; min-height: 70px; }
  .three { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .three label { font-weight: 600; font-size: 14px; display: grid; gap: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  .btn { border: 0; cursor: pointer; padding: 10px 20px; border-radius: 50px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; font: inherit; font-weight: 600; font-size: 14px; }
  .msg { font-size: 13.5px; color: var(--mute); }
  .msg.ok { color: var(--ok); }
  .more { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
  .more a.link { color: var(--acc); font-weight: 600; text-decoration: none; }
  footer { padding-block: 36px 56px; color: var(--mute); font-size: 13px; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<header class="top wrap">
  <div class="toprow">
    <h1 data-t="title"></h1>
    <span class="seg" role="group" aria-label="Language / 언어"><button id="lKo" lang="ko">한국어</button><button id="lEn" lang="en">English</button></span>
  </div>
  <p class="lead" data-t="lead"></p>
  <ol class="steps"><li><b>1</b><span data-t="s1"></span></li><li><b>2</b><span data-t="s2"></span></li><li><b>3</b><span data-t="s3"></span></li></ol>
</header>

<main class="wrap">
  <section>
    <div class="grid" id="cards"></div>
  </section>

  <section>
    <div class="panel">
      <h2 data-t="cmpTitle"></h2>
      <div class="tablewrap"><table id="cmp"></table></div>
    </div>
  </section>

  <section id="feedback">
    <div class="panel">
      <h2 data-t="fbTitle"></h2>
      <p class="lead" style="margin-top:4px" data-t="fbLead"></p>
      <div class="q"><span class="qt" data-t="pickQ"></span><div class="opts" id="picks"></div></div>
      <div class="q"><span class="qt" data-t="perQ"></span><div class="three" id="per"></div></div>
      <div class="q"><label for="overall" data-t="overallQ"></label><textarea id="overall" rows="3"></textarea></div>
      <div class="q"><label for="rname" data-t="nameQ"></label><input id="rname" type="text" style="max-width:320px"></div>
      <div class="q"><label for="out" data-t="previewQ"></label><textarea id="out" rows="8" readonly></textarea></div>
      <div class="row"><button class="btn" id="copy"></button><span class="msg" id="msg"></span></div>
    </div>
  </section>

  <section>
    <div class="panel more">
      <div><h2 data-t="moreTitle"></h2><p class="lead" style="margin:0" data-t="moreLead"></p></div>
      <a class="link" id="drafts" target="_blank" rel="noopener"></a>
    </div>
  </section>
</main>
<footer class="wrap" data-t="footer"></footer>

const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
let lang = 'ko', st = { pick: '', per: { current: '', reference: '', orbit: '' }, overall: '', name: '' };
try { lang = localStorage.getItem('ecme-hub-lang') || ((navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en'); const s = JSON.parse(localStorage.getItem('ecme-hub') || 'null'); if (s) st = Object.assign(st, s, { per: Object.assign(st.per, s.per || {}) }); } catch (e) {}
const t = (k) => T[lang][k];
function save() { try { localStorage.setItem('ecme-hub', JSON.stringify(st)); } catch (e) {} compose(); }

function render() {
  document.documentElement.lang = lang; document.title = t('title');
  document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = t(n.dataset.t); });
  $('lKo').setAttribute('aria-pressed', lang === 'ko'); $('lEn').setAttribute('aria-pressed', lang === 'en');
  const cards = $('cards'); cards.textContent = '';
  SITES.forEach((s) => {
    const [num, name, desc, pts] = t('names')[s]; const url = BASE + s + '/';
    const c = el('article', 'card');
    const a = el('a', 'thumb'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', name + ' — ' + t('open'));
    const im = el('img'); im.src = IMG[s]; im.alt = ''; a.append(im);
    const b = el('div', 'body'); const ul = el('ul'); pts.forEach((p) => ul.append(el('li', null, p)));
    const o = el('a', 'open', t('open')); o.href = url; o.target = '_blank'; o.rel = 'noopener';
    b.append(el('span', 'num', num), el('h3', null, name), el('p', null, desc), ul, el('span', 'url', url.replace('https://', '')), o);
    c.append(a, b); cards.append(c);
  });
  const tb = $('cmp'); tb.textContent = ''; const hr = el('tr'); t('cmpHead').forEach((h) => hr.append(el('th', null, h))); tb.append(hr);
  t('cmpRows').forEach((r) => { const tr = el('tr'); r.forEach((v) => tr.append(el('td', null, v))); tb.append(tr); });
  const pk = $('picks'); pk.textContent = '';
  [...SITES, 'none'].forEach((s) => { const l = el('label', 'opt'); const r = el('input'); r.type = 'radio'; r.name = 'pick'; r.value = s; r.checked = st.pick === s; r.onchange = () => { st.pick = s; save(); }; l.append(r, el('span', null, s === 'none' ? t('pickNone') : t('names')[s][0] + ' ' + t('names')[s][1])); pk.append(l); });
  const per = $('per'); per.textContent = '';
  SITES.forEach((s) => { const l = el('label'); l.append(el('span', null, t('names')[s][0])); const ta = el('textarea'); ta.rows = 3; ta.placeholder = t('perPh'); ta.value = st.per[s]; ta.oninput = () => { st.per[s] = ta.value; save(); }; l.append(ta); per.append(l); });
  $('overall').value = st.overall; $('rname').value = st.name; $('rname').placeholder = t('namePh');
  $('copy').textContent = t('copy'); $('msg').textContent = '';
  const d = $('drafts'); d.href = BASE + 'drafts/'; d.textContent = t('drafts');
  compose();
}
function compose() {
  const L = [t('head'), t('lName') + ': ' + (st.name || '-')];
  L.push(t('lPick') + ': ' + (st.pick ? (st.pick === 'none' ? t('pickNone') : t('names')[st.pick][0] + ' ' + t('names')[st.pick][1]) : t('none')));
  const per = SITES.filter((s) => st.per[s].trim());
  if (per.length) { L.push(t('lPer') + ':'); per.forEach((s) => L.push('- ' + t('names')[s][0] + ': ' + st.per[s].trim().replace(/\n+/g, ' / '))); }
  L.push(t('lAll') + ': ' + (st.overall.trim() || t('none')));
  $('out').value = L.join('\n');
}
$('overall').oninput = (e) => { st.overall = e.target.value; save(); };
$('rname').oninput = (e) => { st.name = e.target.value; save(); };
$('copy').onclick = async () => {
  compose(); const ta = $('out');
  try { await navigator.clipboard.writeText(ta.value); $('msg').textContent = t('copied'); $('msg').classList.add('ok'); }
  catch (e) { ta.focus(); ta.select(); $('msg').textContent = t('copyFail'); $('msg').classList.remove('ok'); }
};
$('lKo').onclick = () => { lang = 'ko'; try { localStorage.setItem('ecme-hub-lang', lang); } catch (e) {} render(); };
$('lEn').onclick = () => { lang = 'en'; try { localStorage.setItem('ecme-hub-lang', lang); } catch (e) {} render(); };
render();
</script>
</body>
</html>
