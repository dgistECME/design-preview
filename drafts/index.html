<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>ECME 홈페이지 시안 리뷰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one reading column of grouped design cards; a sticky "my picks" bar; a full-screen viewer overlay for live renders. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #161a23; --mute: #5d6576; --line: #e2e5eb;
  --accent: #3d4fd6; --accent-soft: #eaedfd; --star: #d99a00; --star-soft: #fff4d6; --ok: #1e7a4a;
  --shade: rgba(14, 18, 28, .72);
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1b1f27; --ink: #e8ebf1; --mute: #a1a9b8; --line: #2c323d;
  --accent: #8e9bff; --accent-soft: #252b4a; --star: #f2b829; --star-soft: #3a3016; --ok: #5fc48b; --shade: rgba(0,0,0,.8); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1b1f27; --ink: #e8ebf1; --mute: #a1a9b8; --line: #2c323d;
  --accent: #8e9bff; --accent-soft: #252b4a; --star: #f2b829; --star-soft: #3a3016; --ok: #5fc48b; --shade: rgba(0,0,0,.8); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }

header.top { padding-block: 40px 8px; display: grid; gap: 14px; }
header.top h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 700; letter-spacing: -0.02em; }
.lead { color: var(--mute); max-width: 66ch; margin: 0; }
.steps { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 0; padding: 0; list-style: none; }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.steps b { color: var(--accent); margin-right: 6px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-block: 10px; }
.picks { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.picks .lbl { font-size: 13px; color: var(--mute); margin-right: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.chip.star { background: var(--star-soft); border-color: transparent; }
.chip.empty { color: var(--mute); border-style: dashed; }
.chip button { border: 0; background: none; padding: 0; color: var(--mute); }
.save { margin-left: auto; font-size: 13px; color: var(--mute); }
.save.ok { color: var(--ok); }
.jump { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--mute); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

section.group { padding-block: 34px 6px; }
.ghead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; margin-bottom: 4px; }
.ghead h2 { font-size: 20px; font-weight: 700; }
.motion { font-size: 12px; border-radius: 6px; padding: 2px 8px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.gnote { color: var(--mute); margin: 0 0 14px; max-width: 70ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card.picked { border-color: var(--star); box-shadow: 0 0 0 2px var(--star-soft); }
.thumb { display: block; border: 0; padding: 0; background: var(--line); aspect-ratio: 16 / 11; width: 100%; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform .3s; }
.thumb:hover img { transform: scale(1.02); }
.cbody { padding: 12px 14px 14px; display: grid; gap: 8px; }
.ctitle { display: flex; gap: 8px; align-items: baseline; }
.ctitle .code { font-family: var(--f-mono); font-size: 12px; color: var(--accent); font-weight: 600; flex: none; }
.ctitle h3 { font-size: 15.5px; font-weight: 600; }
.cdesc { color: var(--mute); font-size: 13.5px; margin: 0; }
.cact { display: flex; gap: 6px; flex-wrap: wrap; }
.tog { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
.tog[aria-pressed="true"] { background: var(--star-soft); border-color: var(--star); }
.tog.note[data-has="1"] { border-color: var(--accent); color: var(--accent); }
textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; resize: vertical; min-height: 64px; font-size: 14px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 16px; }
.panel h2 { font-size: 20px; }
.q { display: grid; gap: 8px; }
.q > label, .q > .qt { font-weight: 600; }
.q small { color: var(--mute); font-weight: 400; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt span { display: grid; }
.opt small { color: var(--mute); }
.who { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 13.5px; }
.who img { width: 22px; height: 22px; border-radius: 50%; }

.results { display: grid; gap: 22px; }
.tally { display: grid; gap: 6px; }
.trow { display: grid; grid-template-columns: minmax(0, 220px) 1fr 32px; gap: 10px; align-items: center; font-size: 14px; }
.trow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 6px; }
.trow .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--mute); }
.cmts { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.cmts li { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; }
.cmts .meta { font-size: 12.5px; color: var(--mute); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cmts .meta img { width: 18px; height: 18px; border-radius: 50%; }
.cmts p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.empty-note { color: var(--mute); margin: 0; }
footer { padding-block: 40px 60px; color: var(--mute); font-size: 13px; }

/* viewer overlay */
.ov { position: fixed; inset: 0; z-index: 20; background: var(--shade); display: grid; grid-template-rows: auto 1fr; }
.ov[hidden] { display: none !important; }
.ovbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ovt { min-width: 0; flex: 1 1 220px; }
.ovt b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ovt span { display: block; font-size: 12.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ovnote { flex-basis: 100%; display: none; }
.ovnote.open { display: block; }
.ovnote textarea { min-height: 52px; }
.stage { position: relative; overflow-x: hidden; overflow-y: scroll; background: var(--bg); }
.frame { transform-origin: 0 0; width: 1440px; background: #fff; }
.frame iframe { display: block; border: 0; width: 1440px; background: #fff; }
.full { display: block; width: 100%; max-width: 1440px; margin: 0 auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.toprow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.lang button { padding: 6px 12px; }
.rhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.trnote { margin: 0; font-size: 13px; color: var(--mute); }
.trtag { color: var(--mute); font-size: 12px; }
@media (max-width: 640px) { .trow { grid-template-columns: minmax(0, 1fr) 80px 24px; } .save { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top wrap">
  <div class="toprow">
    <h1 data-i18n="title"></h1>
    <span class="seg lang" role="group" aria-label="Language / 언어"><button id="lKo" lang="ko">한국어</button><button id="lEn" lang="en">English</button></span>
  </div>
  <p class="lead" data-i18n="lead"></p>
  <ol class="steps">
    <li><b>1</b><span data-i18n="step1"></span></li>
    <li><b>2</b><span data-i18n="step2"></span></li>
    <li><b>3</b><span data-i18n="step3"></span></li>
  </ol>
</header>

<div class="bar"><div class="wrap">
  <div class="picks" id="picks" aria-live="polite"></div>
  <div class="jump"><a class="btn" href="#feedback" data-i18n="jumpFeedback"></a><a class="btn" id="jumpRes" href="#results" data-i18n="jumpResults"></a></div>
  <span class="save" id="save"></span>
</div></div>

<main class="wrap" id="groups"></main>

<section class="wrap" style="padding-block: 40px 0;">

  </div>
</section>

<section class="wrap" id="resultsWrap" style="padding-block: 28px 0;">

    <p class="trnote" id="trNote" hidden></p>
    <div class="results" id="resbody"></div>
  </div>
</section>

<section class="wrap" id="sendWrap" style="padding-block: 28px 0;" hidden>

    <div class="q"><label for="sendText" data-i18n="previewLabel"></label><textarea id="sendText" rows="9" readonly></textarea></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="copyBtn" data-i18n="copyBtn"></button><span class="save" id="copyMsg" style="margin-left:0"></span></div>
  </div>
</section>

<footer class="wrap" data-i18n="footer"></footer>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="ovTitle">

    <button class="btn" id="ovClose" data-i18n="close"></button>

    <button class="tog note" id="ovNoteBtn"></button>
    <div class="ovnote" id="ovNote"><textarea id="ovNoteText" data-i18n-ph="notePh"></textarea></div>
  </div>
  <div class="stage" id="stage"></div>
</div>

async function translate() {
  const texts = commentTexts();
  const pending = texts.filter((x) => !(x in TR[lang]));

    const c = e && e.code;

}

let cur = -1, mode = 'live', lastFocus = null, pageH = null;
function openViewer(id) {
  const i = ITEMS.findIndex((x) => x.id === id); if (i < 0) return;
  if ($('ov').hidden) lastFocus = document.activeElement;
  cur = i; $('ov').hidden = false; document.documentElement.style.overflow = 'hidden';
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  loadStage(); paintOvState(); $('ovClose').focus();
}
function closeViewer() {
  $('ov').hidden = true; document.documentElement.style.overflow = ''; $('stage').textContent = '';
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (lastFocus) lastFocus.focus();
}
function step(d) { openViewer(ITEMS[(cur + d + ITEMS.length) % ITEMS.length].id); }
function paintOvState() {
  const it = ITEMS[cur]; if (!it) return;
  $('ovTitle').textContent = L(it, 'title'); $('ovDesc').textContent = L(GROUPS[it.g], 'name') + ' · ' + L(it, 'desc');
  $('ovCount').textContent = (cur + 1) + ' / ' + ITEMS.length;
  const on = mine.picks.includes(it.id); $('ovStar').setAttribute('aria-pressed', on); $('ovStar').textContent = on ? t('liked') : t('like');
  const ta = $('ovNoteText'); if (document.activeElement !== ta) ta.value = mine.notes[it.id] || '';
  $('ovNoteBtn').dataset.has = mine.notes[it.id] ? '1' : '0'; $('ovNoteBtn').textContent = mine.notes[it.id] ? t('noted') : t('note');
  $('mLive').setAttribute('aria-pressed', mode === 'live'); $('mImg').setAttribute('aria-pressed', mode === 'img');
}
function loadStage() {
  const it = ITEMS[cur], st = $('stage'); st.textContent = ''; st.scrollTop = 0; pageH = null;
  if (mode === 'img') { const im = el('img', 'full'); im.src = 'f/' + it.id + '.jpg'; im.alt = L(it, 'title') + ' — ' + t('fullImg'); st.append(im); return; }
  const fr = el('div', 'frame'); const ifr = el('iframe'); ifr.title = L(it, 'title'); ifr.src = 'd/' + it.id + '.dc.html';
  ifr.addEventListener('load', () => { measure(ifr); setTimeout(() => measure(ifr), 900); try { ifr.contentWindow.document.addEventListener('keydown', onKey); } catch (e) {} });
  fr.append(ifr); st.append(fr); layout();
}
function measure(ifr) { try { const d = ifr.contentDocument; d.documentElement.style.overflow = 'hidden'; pageH = Math.max(600, d.documentElement.scrollHeight); } catch (e) { pageH = null; } layout(); }
function layout() {
  const st = $('stage'), fr = st.querySelector('.frame'); if (!fr) return;
  const s = Math.min(1, st.clientWidth / 1440), ifr = fr.firstChild;
  const h = pageH || Math.ceil(st.clientHeight / s);
  ifr.style.height = h + 'px'; fr.style.transform = 'scale(' + s + ')';
  fr.style.marginRight = (1440 * s - 1440) + 'px'; fr.style.marginBottom = (h * s - h) + 'px';
  st.style.overflowY = pageH ? 'scroll' : 'hidden';
}
function onKey(e) {
  if ($('ov').hidden) return;
  const typing = /TEXTAREA|INPUT/.test((e.target && e.target.tagName) || '');
  if (e.key === 'Escape') { closeViewer(); e.preventDefault(); }
  else if (!typing && e.key === 'ArrowRight') { step(1); e.preventDefault(); }
  else if (!typing && e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
}
document.addEventListener('keydown', onKey);
$('ovClose').onclick = closeViewer; $('ovPrev').onclick = () => step(-1); $('ovNext').onclick = () => step(1);
$('ovReplay').onclick = () => loadStage();
$('mLive').onclick = () => { mode = 'live'; loadStage(); paintOvState(); };
$('mImg').onclick = () => { mode = 'img'; loadStage(); paintOvState(); };
$('ovStar').onclick = () => togglePick(ITEMS[cur].id);
$('ovNoteBtn').onclick = () => { const n = $('ovNote'); n.classList.toggle('open'); if (n.classList.contains('open')) $('ovNoteText').focus(); layout(); };
$('ovNoteText').oninput = (e) => setNote(ITEMS[cur].id, e.target.value);
new ResizeObserver(layout).observe($('stage'));

/* ---------- share mode: compose + copy ---------- */
function composeFeedback() {
  const lines = [t('sHead'), t('sName') + ': ' + (mine.name || '-')];
  lines.push(t('sPicks') + ': ' + (mine.picks.length ? mine.picks.map((id) => byId[id] ? byId[id].code + ' ' + shortTitle(byId[id]) : id).join(', ') : t('sNone')));
  const d = t('dirs').find((x) => x[0] === mine.direction);
  lines.push(t('sDir') + ': ' + (d ? d[1] : t('sNone')) + (mine.dirNote ? ' / ' + mine.dirNote : ''));
  lines.push(t('sFix') + ': ' + (mine.overall ? mine.overall : t('sNone')));
  const notes = ITEMS.filter((it) => mine.notes[it.id]);
  if (notes.length) { lines.push(t('sNotes') + ':'); notes.forEach((it) => lines.push('- ' + it.code + ' ' + shortTitle(it) + ': ' + mine.notes[it.id].replace(/\n+/g, ' / '))); }
  return lines.join('\n');
}
function renderSend() { if (!SHARE) return; if (document.activeElement !== $('rname')) $('rname').value = mine.name || ''; $('sendText').value = composeFeedback(); }
$('rname').oninput = (e) => { mine.name = e.target.value; queueSave(); };
$('copyBtn').onclick = async () => {
  renderSend(); const ta = $('sendText');
  try { await navigator.clipboard.writeText(ta.value); $('copyMsg').textContent = t('copied'); $('copyMsg').classList.add('ok'); }
  catch (e) { ta.focus(); ta.select(); $('copyMsg').textContent = t('copyFail'); $('copyMsg').classList.remove('ok'); }
};

/* ---------- boot ---------- */
try { const loc = JSON.parse(localStorage.getItem('ecme-review') || 'null'); if (loc) Object.assign(mine, loc, { notes: loc.notes || {} }); } catch (e) {}
applyLang();
const startId = location.hash.slice(1); if (byId[startId]) openViewer(startId);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (byId[h] && (cur < 0 || ITEMS[cur].id !== h || $('ov').hidden)) openViewer(h); });
if (SHARE) { $('resultsWrap').hidden = true; $('sendWrap').hidden = false; status('savedLocal', true); renderSend(); }
(async () => {
  if (SHARE) return;
  try { uid = window.claude && window.claude.user ? await window.claude.user.id() : null; } catch (e) { uid = null; }
  db = window.claude && window.claude.db ? window.claude.db : null;
  if (!db) { status('localOnly'); renderResults(); return; }
  db.collection('reviews').onSnapshot((snap) => {
    all = {}; snap.docs.forEach((d) => { if (d.exists) all[d.id] = d.data(); });
    if (uid && !loadedMine) {
      loadedMine = true;
      const srv = all[uid];
      if (srv) { mine = { picks: srv.picks || [], direction: srv.direction || '', dirNote: srv.dirNote || '', overall: srv.overall || '', notes: Object.assign({}, srv.notes || {}) }; paintMine(); status('saved', true); }
      else if (mine.picks.length || mine.overall || mine.direction || Object.keys(mine.notes).length) save();
      else status('autoSave');
    } else if (!uid && !loadedMine) { loadedMine = true; status('localNoId'); }
    renderResults();
  }, () => { db = null; status('localOnly'); renderResults(); });
})();
</script>
</html>
